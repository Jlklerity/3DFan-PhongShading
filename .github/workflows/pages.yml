name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    name: Build WebGL demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      - name: Fetch GLM
        run: git clone --depth 1 --branch 1.0.1 https://github.com/g-truc/glm.git third_party/glm

      - name: Create site directory
        run: mkdir -p site

      - name: Build Assignment-3-3DFan-PhongShading
        run: |
          bash build_web.sh
          mkdir -p site/Assignment-3-3DFan-PhongShading
          cp -r web/. site/Assignment-3-3DFan-PhongShading/

      - name: Generate index.html
        run: |
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>OpenGL 3D Fan with Phong Shading</title>
          </head>
          <body>
            <h1>OpenGL ES 3.0 Modern</h1>
            <p>An interactive WebGL demo that runs directly in your browser. No installation needed.</p>

            <h2>Assignment 3DFan PhongShading</h2>
            <p>Interactive 3D Fan with touch and swipe controls.</p>
            <p><a href="Assignment-3-3DFan-PhongShading/">Launch 3D Fan</a></p>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5